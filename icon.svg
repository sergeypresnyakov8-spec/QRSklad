<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with safe padding -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer decorative frame -->
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Warehouse / Box Icon Top -->
  <g transform="translate(136, 100)">
    <!-- 3D Isometric Box -->
    <path d="M120 10 L220 60 L120 110 L20 60 Z" fill="#3b82f6" opacity="0.9" />
    <path d="M20 60 L120 110 L120 200 L20 150 Z" fill="#2563eb" />
    <path d="M120 110 L220 60 L220 150 L120 200 Z" fill="#1d4ed8" />
    <!-- Tape / Ribbon -->
    <path d="M70 35 L170 85 L150 95 L50 45 Z" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- QR scanner reticle & target -->
  <g transform="translate(106, 260)">
    <!-- QR Corner Reticles -->
    <path d="M10 50 L10 10 L50 10" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 10 L290 10 L290 50" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 150 L10 190 L50 190" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 190 L290 190 L290 150" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- QR Mini Blocks -->
    <rect x="40" y="40" width="40" height="40" rx="6" fill="#f8fafc"/>
    <rect x="50" y="50" width="20" height="20" rx="3" fill="#0f172a"/>
    <rect x="220" y="40" width="40" height="40" rx="6" fill="#f8fafc"/>
    <rect x="230" y="50" width="20" height="20" rx="3" fill="#0f172a"/>
    <rect x="40" y="120" width="40" height="40" rx="6" fill="#f8fafc"/>
    <rect x="50" y="130" width="20" height="20" rx="3" fill="#0f172a"/>

    <rect x="110" y="45" width="25" height="25" rx="4" fill="#38bdf8"/>
    <rect x="165" y="45" width="25" height="25" rx="4" fill="#f8fafc"/>
    <rect x="110" y="100" width="80" height="20" rx="4" fill="#10b981"/>
    <rect x="220" y="120" width="30" height="30" rx="4" fill="#38bdf8"/>
    <rect x="130" y="145" width="40" height="25" rx="4" fill="#f8fafc"/>

    <!-- Scanning Laser Line -->
    <line x1="20" y1="100" x2="280" y2="100" stroke="#ef4444" stroke-width="6" stroke-linecap="round" filter="drop-shadow(0 0 6px #ef4444)"/>
  </g>
</svg>
